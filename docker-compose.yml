services:
  mongo:
    build:
      context: ./docker/mongo
      dockerfile: Dockerfile
    container_name: loompilot-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: loompilot
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'rs.status().ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: loompilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: loompilot-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: loompilot-agents
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      AGENTS_PORT: "8000"
      AGENTS_HOST: "0.0.0.0"
      NODE_API_URL: "http://api:4000"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-loompilot_internal_agent_gateway_token_change_in_prod}"
      MONGODB_RO_URI: "mongodb://agent_ro:agent_ro_pass@mongo:27017/loompilot?replicaSet=rs0&authSource=loompilot"
      LLM_PROVIDER: "${LLM_PROVIDER:-fake}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-3-7-sonnet-20250219}"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: loompilot-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: "production"
      API_PORT: "4000"
      API_HOST: "0.0.0.0"
      APP_NAME: "LoomPilot"
      JWT_SECRET: "${JWT_SECRET:-loompilot_dev_jwt_secret_change_me_in_production_min_32_chars}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-loompilot_dev_refresh_jwt_secret_change_me_min_32_chars}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-loompilot_internal_agent_gateway_token_change_in_prod}"
      MONGODB_URI: "mongodb://loompilot_admin:loompilot_admin_pass@mongo:27017/loompilot?replicaSet=rs0&authSource=admin"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      AGENTS_SERVICE_URL: "http://agents:8000"
      CORS_ORIGIN: "http://localhost:5173"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      agents:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:4000/health\").then(r => r.ok ? process.exit(0) : process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: loompilot-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
  redis_data:

