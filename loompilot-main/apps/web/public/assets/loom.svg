<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" fill="none">
  <!-- Textile Airjet Weaving Loom Machine -->
  <defs>
    <linearGradient id="loomBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
  </defs>

  <!-- Heavy Cast Machine Base Frame -->
  <rect x="20" y="98" width="120" height="18" rx="4" fill="#111827" />
  <rect x="25" y="116" width="20" height="10" rx="2" fill="#374151" />
  <rect x="115" y="116" width="20" height="10" rx="2" fill="#374151" />

  <!-- Side Uprights -->
  <rect x="24" y="32" width="18" height="68" rx="3" fill="url(#loomBodyGrad)" />
  <rect x="118" y="32" width="18" height="68" rx="3" fill="url(#loomBodyGrad)" />

  <!-- Warp Beam (Back Roller with Yarn) -->
  <rect x="38" y="38" width="84" height="14" rx="4" fill="#5ea5d8" />
  <line x1="42" y1="45" x2="118" y2="45" stroke="#ffffff" stroke-width="1" opacity="0.6" stroke-dasharray="2 2" />

  <!-- Heddle Frames / Harness -->
  <rect x="52" y="52" width="56" height="32" rx="2" fill="#4b5563" opacity="0.7" />
  <line x1="56" y1="54" x2="56" y2="82" stroke="#9ca3af" stroke-width="1.2" />
  <line x1="64" y1="54" x2="64" y2="82" stroke="#9ca3af" stroke-width="1.2" />
  <line x1="72" y1="54" x2="72" y2="82" stroke="#9ca3af" stroke-width="1.2" />
  <line x1="80" y1="54" x2="80" y2="82" stroke="#9ca3af" stroke-width="1.2" />
  <line x1="88" y1="54" x2="88" y2="82" stroke="#9ca3af" stroke-width="1.2" />
  <line x1="96" y1="54" x2="96" y2="82" stroke="#9ca3af" stroke-width="1.2" />
  <line x1="104" y1="54" x2="104" y2="82" stroke="#9ca3af" stroke-width="1.2" />

  <!-- Weft Shuttle / Insertion Jet -->
  <polygon points="44,66 48,63 112,63 116,66 112,69 48,69" fill="#df5538" />

  <!-- Woven Cloth Take-up Roller -->
  <rect x="38" y="86" width="84" height="14" rx="4" fill="#df5538" />

  <!-- Status Light Beacon Tower -->
  <rect x="124" y="16" width="6" height="16" rx="2" fill="#4b5563" />
  <circle cx="127" cy="18" r="4" fill="#22c55e" />
  <circle cx="127" cy="18" r="7" fill="#22c55e" opacity="0.3" />

  <!-- Digital Control Display Screen -->
  <rect x="26" y="44" width="14" height="18" rx="2" fill="#0284c7" />
  <line x1="28" y1="48" x2="36" y2="48" stroke="#ffffff" stroke-width="1" />
  <line x1="28" y1="52" x2="38" y2="52" stroke="#ffffff" stroke-width="1" />
  <line x1="28" y1="56" x2="34" y2="56" stroke="#ffffff" stroke-width="1" />
</svg>

