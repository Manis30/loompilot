<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" fill="none">
  <!-- 3D Textile Fabric Bolt / Roll -->
  <defs>
    <linearGradient id="fabricRollGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#df5538" />
      <stop offset="45%" stop-color="#f07a60" />
      <stop offset="75%" stop-color="#df5538" />
      <stop offset="100%" stop-color="#b6381e" />
    </linearGradient>
    <linearGradient id="fabricCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7eee4" />
      <stop offset="100%" stop-color="#dfcebc" />
    </linearGradient>
  </defs>
  
  <!-- Outer Roll Cylinder Body -->
  <path d="M42 35 L128 35 C136 35 142 45 142 58 C142 71 136 81 128 81 L42 81 C34 81 28 71 28 58 C28 45 34 35 42 35 Z" fill="url(#fabricRollGrad)" />
  
  <!-- Fabric Drape / Unfurled Meter -->
  <path d="M40 80 Q70 102 120 95 L144 116 L22 116 L30 81 Z" fill="#c74328" opacity="0.9" />
  <path d="M30 84 Q70 105 125 97" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" />
  
  <!-- Left Elliptical End Face -->
  <ellipse cx="42" cy="58" rx="14" ry="23" fill="#df5538" stroke="#ffffff" stroke-width="2" />
  <!-- Inner Cardboard Tube Core -->
  <ellipse cx="42" cy="58" rx="6" ry="10" fill="url(#fabricCoreGrad)" stroke="#a88d75" stroke-width="1" />
  
  <!-- Fabric Weave Texture Lines -->
  <line x1="65" y1="36" x2="65" y2="80" stroke="#ffffff" stroke-width="1" opacity="0.25" stroke-dasharray="2 2" />
  <line x1="85" y1="36" x2="85" y2="80" stroke="#ffffff" stroke-width="1" opacity="0.25" stroke-dasharray="2 2" />
  <line x1="105" y1="36" x2="105" y2="80" stroke="#ffffff" stroke-width="1" opacity="0.25" stroke-dasharray="2 2" />
  
  <!-- Textile Quality Tag -->
  <rect x="94" y="50" width="34" height="20" rx="3" fill="#ffffff" stroke="#e2d6cc" stroke-width="1" />
  <text x="100" y="60" font-family="sans-serif" font-size="7" font-weight="700" fill="#df5538">40s TWILL</text>
  <text x="100" y="66" font-family="sans-serif" font-size="5.5" font-weight="600" fill="#78716c">100% COTTON</text>
</svg>

