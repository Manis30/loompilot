<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" fill="none">
  <!-- 3D Cardboard Box -->
  <!-- Top Flaps / Top Surface -->
  <polygon points="80,15 142,42 80,68 18,42" fill="#d4a373" />
  <!-- Center Top Tape -->
  <polygon points="76,17 84,20 84,66 76,63" fill="#b08968" opacity="0.8" />
  
  <!-- Left Side Face -->
  <polygon points="18,42 80,68 80,125 18,99" fill="#c49363" />
  <!-- Right Side Face -->
  <polygon points="80,68 142,42 142,99 80,125" fill="#a97d52" />
  
  <!-- Vertical Tape on Front -->
  <polygon points="76,66 84,69 84,124 76,122" fill="#8d6641" opacity="0.7" />

  <!-- Shipping Icons on Left Face -->
  <!-- Fragile Wineglass -->
  <path d="M26 84 H32 V87 C32 89 29 90 29 90 V94 H26 V94 Z" stroke="#5c3d1e" stroke-width="1.2" fill="none" opacity="0.75" />
  <!-- This Side Up Arrows -->
  <path d="M38 94 V85 M36 87 L38 84 L40 87" stroke="#5c3d1e" stroke-width="1.2" fill="none" opacity="0.75" />
  <path d="M44 94 V85 M42 87 L44 84 L46 87" stroke="#5c3d1e" stroke-width="1.2" fill="none" opacity="0.75" />
  <!-- Umbrella -->
  <path d="M52 87 C52 84 57 84 57 87 Z M54.5 87 V93 C54.5 94.5 53 94.5 53 93" stroke="#5c3d1e" stroke-width="1.2" fill="none" opacity="0.75" />

  <!-- White Barcode Label on Right Face -->
  <polygon points="102,74 130,62 130,76 102,88" fill="#ffffff" rx="2" />
  <!-- Barcode lines -->
  <line x1="106" y1="74" x2="106" y2="84" stroke="#1f2937" stroke-width="1.8" />
  <line x1="110" y1="72" x2="110" y2="82" stroke="#1f2937" stroke-width="1.2" />
  <line x1="113" y1="71" x2="113" y2="81" stroke="#1f2937" stroke-width="2.2" />
  <line x1="118" y1="69" x2="118" y2="79" stroke="#1f2937" stroke-width="1" />
  <line x1="121" y1="67" x2="121" y2="77" stroke="#1f2937" stroke-width="2.5" />
  <line x1="126" y1="65" x2="126" y2="75" stroke="#1f2937" stroke-width="1.4" />
</svg>
