  <!-- Control Buttons Top -->
  <circle cx="48" cy="28" r="2" fill="#e2e8f0" />
  <circle cx="56" cy="28" r="2" fill="#e2e8f0" />
  <circle cx="64" cy="28" r="2" fill="#e2e8f0" />
