  <!-- Speaker Body in Perspective -->
  <rect x="30" y="26" width="80" height="58" rx="10" fill="#0284c7" />
  <rect x="34" y="30" width="72" height="50" rx="8" fill="#0ea5e9" />
  
  <!-- Front Speaker Grille Lines -->
  <rect x="42" y="38" width="56" height="34" rx="6" fill="#0369a1" />
  
  <!-- Grille Pattern -->
  <g fill="#38bdf8" opacity="0.8">
    <circle cx="50" cy="46" r="2.2" />
    <circle cx="58" cy="46" r="2.2" />
    <circle cx="66" cy="46" r="2.2" />
    <circle cx="74" cy="46" r="2.2" />
    <circle cx="82" cy="46" r="2.2" />
    <circle cx="90" cy="46" r="2.2" />

    <circle cx="50" cy="55" r="2.2" />
    <circle cx="58" cy="55" r="2.2" />
    <circle cx="66" cy="55" r="2.2" />
    <circle cx="74" cy="55" r="2.2" />
    <circle cx="82" cy="55" r="2.2" />
    <circle cx="90" cy="55" r="2.2" />

    <circle cx="50" cy="64" r="2.2" />
    <circle cx="58" cy="64" r="2.2" />
    <circle cx="66" cy="64" r="2.2" />
    <circle cx="74" cy="64" r="2.2" />
    <circle cx="82" cy="64" r="2.2" />
    <circle cx="90" cy="64" r="2.2" />
